services:
  api:
    build:
      context: .
    environment:
      HOST: "${HOST:-0.0.0.0}"
      PORT: "${PORT:-8000}"
      FAQ_OUTPUT_PATH: "${FAQ_OUTPUT_PATH:-data/raw/faqs.json}"
      CHUNKS_OUTPUT_PATH: "${CHUNKS_OUTPUT_PATH:-data/processed/chunks.jsonl}"
      CHUNK_SIZE: "${CHUNK_SIZE:-2000}"
      EMBEDDING_BASE_URL: "http://ollama:11434/v1"
      EMBEDDING_API_KEY: "ollama"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-qwen3-embedding:0.6b}"
      EMBEDDING_BATCH_SIZE: "${EMBEDDING_BATCH_SIZE:-32}"
      QDRANT_URL: "http://qdrant:6333"
      QDRANT_COLLECTION: "${QDRANT_COLLECTION:-eu_taxonomy_faq}"
      TOP_K: "${TOP_K:-5}"
      LLM_BASE_URL: "http://ollama:11434/v1"
      LLM_API_KEY: "ollama"
      LLM_MODEL: "${LLM_MODEL:-qwen2.5:3b}"
      LLM_TEMPERATURE: "${LLM_TEMPERATURE:-0}"
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    depends_on:
      ollama-model:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
    volumes:
      - ./data:/app/data

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  ollama-model:
    image: curlimages/curl:latest
    depends_on:
      ollama:
        condition: service_started
    entrypoint: >
      sh -c "
      until curl -s http://ollama:11434/api/tags >/dev/null;
      do sleep 2; done;
      curl --fail http://ollama:11434/api/pull
      -d '{\"model\":\"${EMBEDDING_MODEL:-qwen3-embedding:0.6b}\"}';
      curl --fail http://ollama:11434/api/pull
      -d '{\"model\":\"${LLM_MODEL:-qwen2.5:3b}\"}'
      "

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", ": > /dev/tcp/127.0.0.1/6333"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ollama_data:
  qdrant_data:
